<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f5f1ea;
}

nav{
background:#6f4e37;
padding:15px;
text-align:center;
}

nav a{
color:white;
text-decoration:none;
margin:0 20px;
font-weight:bold;
}

.container{
width:80%;
margin:40px auto;
}

.order{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:15px;
box-shadow:0 5px 10px rgba(0,0,0,0.05);
display:flex;
justify-content:space-between;
}

button{
padding:6px 14px;
border:none;
border-radius:20px;
background:#6f4e37;
color:white;
cursor:pointer;
}

button:hover{
background:#54392b;
}

</style>

</head>

<body>

<nav>
<a href="/menu">เมนู</a>
<a href="/admin">Admin</a>
</nav>

<div class="container">

<h1>รายการออเดอร์ทั้งหมด</h1>

{% if orders %}

{% for order in orders %}

<div class="order">

<div>
เลขออเดอร์ #{{ order.id }}
</div>

<div>

{{ order.total }} บาท

<!-- แก้ตรงนี้ -->
<a href="/order/{{ order.id }}">
<button>ดูรายละเอียด</button>
</a>

</div>

</div>

{% endfor %}

{% else %}

<p>ยังไม่มีออเดอร์</p>

{% endif %}

<br>

<!-- แก้ตรงนี้ -->
<a href="/sales">
<button>ดูกราฟยอดขาย</button>
</a>

</div>

</body>
</html>
